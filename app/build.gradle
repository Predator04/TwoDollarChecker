plugins {
    id 'com.android.application'
}

// Read the OpenAI API key from a gitignored apikey.properties file
def apikeyProps = new Properties()
def apikeyPropsFile = rootProject.file('apikey.properties')
if (apikeyPropsFile.exists()) {
    apikeyProps.load(new FileInputStream(apikeyPropsFile))
}

android {
    namespace 'com.twodollar.checker'
    compileSdk 34

    defaultConfig {
        applicationId "com.twodollar.checker"
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "4.0"
        buildConfigField "String", "OPENAI_KEY", "\"${apikeyProps.getProperty('OPENAI_KEY', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
